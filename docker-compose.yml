services:
  db:
    image: postgres:16-alpine
    container_name: wow-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-raidlytics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-raidlytics}
      - POSTGRES_DB=${POSTGRES_DB:-raidlytics}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./server
    container_name: wow-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-raidlytics}:${POSTGRES_PASSWORD:-raidlytics}@db:5432/${POSTGRES_DB:-raidlytics}
      - WCL_CLIENT_ID=${WCL_CLIENT_ID}
      - WCL_CLIENT_SECRET=${WCL_CLIENT_SECRET}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-http://localhost:8000/api/auth/discord/callback}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://wow-website.onrender.com,http://localhost:3000}
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./ui
      args:
        REACT_APP_BACKEND_URL: ""
    container_name: wow-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
